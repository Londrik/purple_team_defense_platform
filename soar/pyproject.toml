[project]
name = "purple-team-soar"
version = "0.1.0-alpha"
description = "Purple Team SOAR containment service"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.mutmut]
paths_to_mutate = ["soar/app"]
tests_dir = ["soar/tests"]
