name: Purple Team CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  quality-and-security:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r soar/requirements.txt
          pip install ruff bandit pytest mypy mutmut

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2

      - name: Validate core documentation
        run: |
          for doc in README.md ARCHITECTURE.md MITRE_MAPPING.md CONTRIBUTING.md CHANGELOG.md; do
            test -s "$doc"
          done
          python3 -c '
import pathlib
for doc in ["README.md", "ARCHITECTURE.md"]:
    text = pathlib.Path(doc).read_text(encoding="utf-8")
    assert "```mermaid" in text or "~~~mermaid" in text, f"Missing mermaid block in {doc}"
'
          python3 -c '
import json, pathlib, re
text = pathlib.Path("MITRE_MAPPING.md").read_text(encoding="utf-8")
blocks = re.findall(r"~~~json\n(.*?)~~~", text, flags=re.DOTALL)
assert len(blocks) >= 4, "Expected at least 4 ECS JSON examples"
for raw in blocks:
    data = json.loads(raw)
    assert data["threat"]["framework"] == "MITRE ATT&CK"
    assert data["threat"]["tactic"]["id"]
    assert data["threat"]["technique"]["id"]
'

      - name: Lint and format check
        run: |
          ruff check soar/
          ruff format --check soar/

      - name: Static type check
        run: |
          mypy --config-file soar/pyproject.toml soar/app soar/tests

      - name: Static security scan
        run: |
          bandit -r soar/app

      - name: Run unit and regression tests
        run: |
          pytest soar/tests -v

      - name: Mutation testing
        run: |
          if [ -n "$(find soar/app -name "*.py" ! -name "__init__.py")" ]; then
            mutmut run --paths-to-mutate soar/app --tests-dir soar/tests --runner "pytest soar/tests -q"
            mutmut results
          fi
